<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E5AA8">
  <title>值日检查记录（南校区）</title>
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">值日检查记录（南校区）</h1>
    <nav id="module-switch" class="module-switch" aria-label="检查类型">
      <button type="button" class="module is-active" data-module="daily">日常值日检查</button>
      <button type="button" class="module" data-module="flag">周一升旗检查</button>
    </nav>
    <nav class="tabs" aria-label="页面切换">
      <button type="button" class="tab is-active" data-tab="entry">录入</button>
      <button type="button" class="tab" data-tab="summary">汇总</button>
      <button type="button" class="tab" data-tab="rating">星级评比</button>
      <button type="button" class="tab" data-tab="history">历史与备份</button>
    </nav>
    <p id="sync-chip" class="sync-chip" hidden></p>
  </header>

  <main>
    <section id="panel-entry" class="panel is-active">
      <form id="entry-form" novalidate>
        <label>日期
          <input id="f-date" name="date" type="date" required>
        </label>
        <label>年级
          <select id="f-grade" name="grade" required></select>
        </label>
        <label>班级
          <select id="f-class" name="classNo" required></select>
        </label>

        <p id="ground-chip" class="ground-chip" hidden></p>

        <div id="flag-fields" hidden>
          <label>学号（可填多个）
            <input id="f-student-nos" name="studentNos" type="text" inputmode="numeric" autocomplete="off" placeholder="例如：3 7 12">
          </label>
          <p class="hint">用空格、逗号或顿号分隔；留空表示整班问题。</p>
        </div>

        <div id="daily-only">
          <fieldset>
            <legend>填写位置方式</legend>
            <label><input type="radio" name="locationType" value="seat" checked> 第几排第几个</label>
            <label><input type="radio" name="locationType" value="student"> 学生姓名</label>
          </fieldset>

          <div id="seat-fields">
            <label>第几排（竖着数）
              <input id="f-row" name="row" type="number" min="1" step="1">
            </label>
            <label>第几个（竖着数）
              <input id="f-seat" name="seat" type="number" min="1" step="1">
            </label>
          </div>

          <div id="student-fields" hidden>
            <label>学生姓名
              <input id="f-student" name="studentName" type="text" maxlength="20">
            </label>
          </div>

          <label>检查时间
            <select id="f-slot" name="slot" required></select>
          </label>
        </div>

        <div id="reason-grid" class="reason-grid" aria-label="扣分原因"></div>

        <label>分值
          <input id="f-points" name="points" type="number" min="1" step="1" value="1" required>
        </label>
        <label>备注
          <textarea id="f-note" name="note" rows="2" maxlength="80"></textarea>
        </label>
        <p id="entry-message" class="message" role="status"></p>
        <button id="save-record" type="submit" class="primary">保存记录</button>
      </form>
      <h2>当天记录</h2>
      <div id="today-list" class="record-list"></div>
    </section>

    <section id="panel-summary" class="panel">
      <h2 id="summary-title">日常值日检查汇总</h2>
      <label>汇总日期
        <input id="summary-date" type="date">
      </label>
      <div id="summary-total" class="summary-total"></div>
      <p id="summary-message" class="message" role="status"></p>
      <button id="export-image" type="button" class="primary">导出当天图片</button>
      <div id="summary-groups" class="summary-groups"></div>
    </section>

    <section id="panel-rating" class="panel">
      <h2 id="rating-title">本周星级班级评比</h2>
      <label>选择这一周（点任意一天）
        <input id="rating-week" type="date">
      </label>
      <p id="rating-range" class="hint"></p>
      <div id="rating-total" class="summary-total"></div>
      <p id="rating-message" class="message" role="status"></p>
      <button id="export-rating" type="button" class="primary">导出本周评比图片</button>
      <div id="rating-groups" class="summary-groups"></div>
    </section>

    <section id="panel-history" class="panel">
      <h2>历史日期</h2>
      <div id="history-list" class="record-list"></div>
      <h2>备份</h2>
      <button id="export-backup" type="button">导出 JSON 备份</button>
      <label>导入方式
        <select id="import-mode">
          <option value="merge" selected>合并导入</option>
          <option value="replace">覆盖本机数据</option>
        </select>
      </label>
      <label>选择备份文件
        <input id="import-file" type="file" accept="application/json,.json">
      </label>
      <p id="history-message" class="message" role="status"></p>
      <h2>版本</h2>
      <p id="app-version" class="hint"></p>
      <button id="check-update" type="button">检查更新</button>
      <h2>云同步</h2>
      <p class="hint">把记录存到你自己的私有 GitHub 仓库，手机上的 App、手机浏览器、电脑浏览器看到的就是同一份数据。每台设备、每个入口只需粘贴一次令牌。</p>
      <label>访问令牌
        <input id="sync-token" type="password" inputmode="text" autocomplete="off" spellcheck="false" placeholder="粘贴 GitHub 令牌">
      </label>
      <button id="sync-save" type="button" class="primary">保存令牌并立即同步</button>
      <button id="sync-now" type="button">立即同步</button>
      <button id="sync-clear" type="button">清除令牌</button>
      <p id="sync-status" class="message" role="status"></p>
    </section>
  </main>

  <script type="module" src="../../app.js"></script>
</body>
</html>
